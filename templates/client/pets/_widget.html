{# Widget pupili na dashboardzie (spec v3 §7) — szkielet SSR, mini-pokój / stany rysuje pets-widget.js z data-state #}
{% if pets_widget %}
<div class="dashboard-section pets-widget" id="petsWidget"
     data-state='{{ pets_widget | tojson }}'
     data-api="/client/pupile/api"
     data-user-id="{{ current_user.id }}"
     data-home-url="{{ url_for('pets.home') }}"
     data-house-url="{{ url_for('pets.scene', scene='domek') }}"
     data-hospital-url="{{ url_for('pets.scene', scene='szpital') }}"
     data-ward-url="{{ url_for('pets.hospital_room', sala='izba-przyjec') }}"
     data-incubator-url="{{ url_for('pets.hospital_room', sala='inkubatorium') }}">
    <div class="widget">
        <div class="widget-header">
            <h2 class="widget-title"><span class="pets-widget__title-icon" aria-hidden="true">🐾</span> Moje pupile</h2>
            <a href="{{ url_for('pets.home') }}" class="widget-link">Do świata &rarr;</a>
        </div>
        <div class="widget-body pets-widget__body"></div>
    </div>
</div>
{% endif %}
