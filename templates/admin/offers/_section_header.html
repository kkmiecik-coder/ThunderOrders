{# ============================================================
   Wspólny nagłówek sekcji Page Buildera.

   JEDNO źródło markupu dla wszystkich typów sekcji:
   - sekcje istniejące renderuje Jinja (pętla w edit.html),
   - nowe sekcje klonuje JS z <template> na dole edit.html (patrz
     buildSectionHeader() w offer-builder.js) — dlatego etykieta typu
     jest podmienialnym placeholderem __LABEL__.

   Przełącznik stanu pokazujemy TYLKO na stronach pre-order; na exclusive
   dostępnością steruje system limitów i rezerwacji.
   ============================================================ #}

{% macro section_header(label, display_state='active', allow_sold_out=true, show_state_switch=true) %}
<div class="section-header">
    <div class="section-drag-handle">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M7 2a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM7 5a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM7 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm-3 3a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm-3 3a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/>
        </svg>
    </div>
    <span class="section-type-label">{{ label }}</span>

    {% if show_state_switch %}
    {% set states = [('active', 'Aktywna'), ('sold_out', 'Sold-out'), ('hidden', 'Ukryta')] if allow_sold_out
                    else [('active', 'Aktywna'), ('hidden', 'Ukryta')] %}
    <div class="section-state-switch"
         data-state="{{ display_state }}"
         data-options="{{ states|length }}"
         role="radiogroup"
         aria-label="Stan sekcji na stronie sprzedaży">
        <span class="state-switch-thumb" aria-hidden="true"></span>
        {% for value, text in states %}
        <button type="button"
                class="state-switch-option{% if display_state == value %} is-active{% endif %}"
                data-state="{{ value }}"
                data-label="{{ text }}"
                role="radio"
                aria-checked="{{ 'true' if display_state == value else 'false' }}"
                onclick="setSectionDisplayState(this)">{{ text }}</button>
        {% endfor %}
        <input type="hidden" class="section-display-state" value="{{ display_state }}">
    </div>
    {% endif %}

    <button type="button" class="btn-delete-section" onclick="deleteSection(this)" aria-label="Usuń sekcję">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
            <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
        </svg>
    </button>
</div>
{% endmacro %}
